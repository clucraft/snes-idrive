# The cartridge's layout for the linker: LoROM, 128 KB (four banks of 32 KB; everything is in the first),
# no chip, no battery. The header is at $FFC0 of the first bank, the vectors behind it.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0200, size = $1D00, type = rw, file = "";
    ROM:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    REST:   start = $0000, size = $18000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    CODE:     load = ROM, type = ro, start = $8000;
    RODATA:   load = ROM, type = ro;
    HEADER:   load = ROM, type = ro, start = $FFC0;
    VECTORS:  load = ROM, type = ro, start = $FFE0;
}
